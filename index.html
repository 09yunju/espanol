<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com; img-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>문제은행</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="문제은행">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="brand">문제은행</h1>
    <div class="top-right">
      <button id="syncBtn" class="sync" type="button" aria-label="동기화 상태와 GitHub 설정"></button>
      <nav class="seg" role="tablist" aria-label="화면">
        <button class="tab" role="tab" data-view="bank" aria-selected="true">문제</button>
        <button class="tab" role="tab" data-view="solve" aria-selected="false">풀기</button>
        <button class="tab" role="tab" data-view="words" aria-selected="false">단어</button>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="bank">
    <div id="toolbar" class="toolbar">
      <input id="q" type="search" placeholder="문제·해설 검색" aria-label="문제 검색" autocomplete="off">
      <button class="btn primary" data-action="new">새 문제</button>
    </div>
    <ol id="list" class="list"></ol>
    <div id="empty"></div>
  </section>
  <section id="solve" hidden></section>
  <section id="words" hidden>
    <div id="wtoolbar" class="toolbar">
      <input id="wq" type="search" placeholder="단어·뜻 검색" aria-label="단어 검색" autocomplete="off">
      <button class="btn primary" data-action="new-word">새 단어</button>
    </div>
    <p id="wcount" class="count-line"></p>
    <ul id="wlist" class="wlist"></ul>
    <div id="wempty"></div>
  </section>
</main>

<div id="editor" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <div class="sheet-head">
      <h2 id="edTitle">새 문제</h2>
      <button class="icon" id="edClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="fmtbar" data-keys role="toolbar" aria-label="서식과 기호">
      <button type="button" data-fmt="b" aria-label="굵게" title="굵게 (Ctrl/⌘+B)"><strong>B</strong></button>
      <button type="button" data-fmt="u" aria-label="밑줄" title="밑줄 (Ctrl/⌘+U)"><u>U</u></button>
      <span class="sep" aria-hidden="true"></span>
    </div>
    <div class="sheet-body">
      <label class="field"><span>문제</span>
        <textarea id="edQ" rows="5" class="serif"></textarea>
        <span class="hint">글자를 선택하고 B나 U를 누르거나, 직접 <code>**굵게**</code>, <code>__밑줄__</code>로 써도 돼요.</span>
      </label>
      <div class="field"><span>보기<small>정답인 보기의 번호를 눌러 표시하세요.</small></span>
        <div id="edChoices"></div>
        <button type="button" id="edAddChoice" class="btn ghost small">보기 추가</button>
      </div>
      <div class="field" id="edPreviewWrap" hidden><span>미리보기</span>
        <div id="edPreview" class="preview-box"></div>
      </div>
      <label class="field"><span>해설</span>
        <textarea id="edExp" rows="5"></textarea>
      </label>
      <p id="edErr" class="err" role="alert"></p>
    </div>
    <div class="sheet-foot">
      <button type="button" id="edDelete" class="btn danger">삭제</button>
      <span class="spacer"></span>
      <button type="button" id="edSaveNext" class="btn">저장하고 새 문제</button>
      <button type="button" id="edSave" class="btn primary">저장</button>
    </div>
  </div>
</div>

<div id="cards" class="overlay cards-overlay" hidden>
  <div class="cards" role="dialog" aria-modal="true" aria-label="단어 카드">
    <div class="cards-head">
      <button class="icon" id="cdClose" type="button" aria-label="닫기">✕</button>
      <span id="cdPos" class="cd-pos"></span>
      <button class="link" id="cdEdit" type="button">수정</button>
    </div>
    <div class="card-stage">
      <div class="card" id="card" role="button" tabindex="0" aria-label="카드 뒤집기">
        <div class="face front"><p class="cd-word serif" id="cdWord" lang="es"></p></div>
        <div class="face back"><p class="cd-small serif" id="cdWordSmall" lang="es"></p><p class="cd-meaning" id="cdMeaning"></p></div>
      </div>
      <button class="speak" id="cdSpeak" type="button" aria-label="발음 듣기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <p class="cd-hint">카드를 누르면 뒤집혀요. 옆으로 밀면 다음 단어로 넘어가요.</p>
    <div class="cards-nav">
      <button class="btn" id="cdPrev" type="button">이전</button>
      <button class="btn" id="cdNext" type="button">다음</button>
    </div>
  </div>
</div>

<div id="wordEditor" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="weTitle">
    <div class="sheet-head">
      <h2 id="weTitle">새 단어</h2>
      <button class="icon" id="weClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="fmtbar" data-keys role="toolbar" aria-label="기호"></div>
    <div class="sheet-body">
      <div class="field"><label for="weWord"><span class="flabel">단어</span></label>
        <div class="word-row">
          <input id="weWord" type="text" class="serif" lang="es" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="speak speak-sm" id="weSpeak" type="button" aria-label="발음 듣기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <label class="field"><span>뜻</span>
        <textarea id="weMeaning" rows="3"></textarea>
      </label>
      <p id="weErr" class="err" role="alert"></p>
    </div>
    <div class="sheet-foot">
      <button type="button" id="weDelete" class="btn danger">삭제</button>
      <span class="spacer"></span>
      <button type="button" id="weSaveNext" class="btn">저장하고 새 단어</button>
      <button type="button" id="weSave" class="btn primary">저장</button>
    </div>
  </div>
</div>

<div id="settings" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <div class="sheet-head">
      <h2 id="stTitle">GitHub 연결</h2>
      <button class="icon" id="stClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body">
      <p class="intro">문제는 내 GitHub 저장소의 <code>problems.json</code>과 <code>stats.json</code>에만 저장돼요. 이 기기에는 토큰 말고는 아무것도 남지 않아요.</p>
      <label class="field"><span>데이터 저장소</span>
        <input id="stRepo" type="text" placeholder="아이디/저장소" autocomplete="off" autocapitalize="off" spellcheck="false">
        <span class="hint">예: myname/qbank-data. 비공개 저장소를 쓰세요.</span>
      </label>
      <label class="field"><span>토큰</span>
        <input id="stToken" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <span class="hint">데이터 저장소 하나에만 Contents 읽기·쓰기 권한을 준 fine-grained 토큰을 쓰세요. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">토큰 만들기</a></span>
      </label>
      <label class="check"><input type="checkbox" id="stRemember" checked>이 기기에 토큰 기억하기</label>
      <p class="hint remember-hint">끄면 앱을 닫을 때 토큰이 지워지고, 열 때마다 다시 입력해야 해요.</p>
      <label class="field"><span>브랜치<small>비워 두면 기본 브랜치를 써요.</small></span>
        <input id="stBranch" type="text" placeholder="main" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <p id="stMsg" class="err" role="alert"></p>
      <div id="stConnected" hidden>
        <p id="stInfo" class="info"></p>
        <div class="row-actions">
          <button type="button" class="btn small" id="stSync">지금 동기화</button>
          <button type="button" class="btn small danger" id="stLogout">이 기기에서 연결 해제</button>
        </div>
      </div>
    </div>
    <div class="sheet-foot">
      <span class="spacer"></span>
      <button type="button" id="stSave" class="btn primary">연결</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
